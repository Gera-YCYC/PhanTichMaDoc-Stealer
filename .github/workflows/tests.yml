name: Software tests - not malware accuracy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - name: Train lại bộ xếp hạng từ dữ liệu đã chốt
        run: python training/verify_ranker_reproduction.py --portable
      - name: Tính lại điểm bốn mẫu từ bằng chứng trong Git
        run: python -m eval.score_public_batch
      - name: Chấm lại báo cáo web Python và .NET trước và sau tự duyệt
        run: python -m eval.web_report_quality
      - name: Đối chiếu kết quả đọc lại từng câu và tìm thêm chứng cứ .NET
        run: |
          python -m eval.narrow_audit
          python -m eval.dotnet_followup
          python -m eval.followup_report_audit
          python -m eval.field_review_audit
          python -m eval.transfer_report_audit
          python -m eval.staging_path_audit
          python -m eval.report_series
          python -m eval.report_series --argument
          python -m eval.cross_format
          python -m eval.parts_audit
          python -m eval.argument_review
          python -m eval.verdict_trial --portable
          python -m eval.table_access_study
          python -m eval.ordinal_review_study
          python -m eval.catch_argument_study
          python -m eval.catch_clean_controls
          python -m eval.role_line_study
          python -m eval.send_site_study
      - run: python -m compileall -q stealer_agent vm_tools training
