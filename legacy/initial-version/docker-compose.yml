# ==============================================================================
# Kiến trúc tách biệt:
# - Host chạy Ollama SLM (16GB RAM / 2-4GB VRAM, model GGUF Q4_K_M)
# - Container `stealer-sandbox` chạy phân tích tĩnh trong môi trường cô lập,
#   mount thư mục samples ở chế độ Read-Only (:ro), không có quyền root,
#   giới hạn CPU/RAM và cắt mọi capability Linux không cần thiết.
# ==============================================================================
services:
  stealer-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stealer-sandbox
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: "2.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - MAX_ITERATIONS=8
    volumes:
      - ./samples:/workspace/samples:ro
      - ./reports:/workspace/reports:rw
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
      - /workspace/workdir:size=512m,noexec,nosuid
    stdin_open: true
    tty: true
